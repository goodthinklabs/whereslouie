name: Louie Location Bridge

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r bridge/requirements.txt

      - name: Poll Tracki and forward to Sheets
        env:
          TRACKI_USER:          ${{ secrets.TRACKI_USER }}
          TRACKI_PASS:          ${{ secrets.TRACKI_PASS }}
          TRACKI_CLIENT_ID:     ${{ secrets.TRACKI_CLIENT_ID }}
          TRACKI_CLIENT_SECRET: ${{ secrets.TRACKI_CLIENT_SECRET }}
          TRACKI_REDIRECT_URI:  ${{ secrets.TRACKI_REDIRECT_URI }}
          APPS_SCRIPT_URL:      ${{ secrets.APPS_SCRIPT_URL }}
          BRIDGE_SECRET:        ${{ secrets.BRIDGE_SECRET }}
        run: python bridge/louie_bridge.py --once
